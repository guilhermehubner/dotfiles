# Hyprland entry point: everything lives in the files sourced below.
# Order matters: variables.conf must come first so the other files can use $mainMod, $lock, etc.
# See https://wiki.hyprland.org/Configuring/Keywords/#sourcing-multi-file

source = ~/.config/hypr/variables.conf
source = ~/.config/hypr/env.conf
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/autostart.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/look.conf
source = ~/.config/hypr/remaps.conf
