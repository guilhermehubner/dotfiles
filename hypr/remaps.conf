# Keybindings
# See https://wiki.hyprland.org/Configuring/Binds/
# $mainMod, $lock and $scripts come from variables.conf

# Apps
bind = $mainMod, Return, exec, alacritty
bind = $mainMod, P, exec, rofi -show drun
bind = $mainMod, D, exec, rofi -show window

# Windows
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, Q, exit,
bind = $mainMod SHIFT, Space, togglefloating,
bind = $mainMod, F, fullscreen, 1
bind = $mainMod, C, centerwindow,

# Lock and suspend. `$lock` waits until the screen is locked (-f), then suspends. No sudo:
# systemctl suspend works without it for the logged-in user (sudo couldn't prompt here anyway).
bind = $mainMod SHIFT, L, exec, $lock && systemctl suspend

# Hide/show waybar (SIGUSR1 toggles it), or start it if it isn't running
bindr = $mainMod, B, exec, pkill -SIGUSR1 waybar || waybar

# Resize the master area. splitratio only works in the dwindle layout; with layout = master the
# master width is changed with mfact.
bindle = $mainMod, left, layoutmsg, mfact -0.03
bindle = $mainMod, right, layoutmsg, mfact +0.03

# Move focus
bind = $mainMod, K, cyclenext, prev
bind = $mainMod, J, cyclenext,

bind = $mainMod ALT, K, swapnext, prev
bind = $mainMod ALT, J, swapnext,

# Switch workspaces with mainMod + [1-5]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

# Move active window to a workspace with mainMod + SHIFT + [1-5]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Media
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioPrev, exec, playerctl previous
bind = , XF86AudioNext, exec, playerctl next

bindl = , XF86AudioMedia, exec, playerctl play-pause
bindl = , XF86AudioStop, exec, playerctl stop

# Volume, on the current output device (was sink 0, the first device, not the one in use).
# The script caps volume at 100% and shows the notification; mute also shows it now.
bindle = , XF86AudioRaiseVolume, exec, $scripts/volume.sh up
bindle = , XF86AudioLowerVolume, exec, $scripts/volume.sh down
bindl = , XF86AudioMute, exec, $scripts/volume.sh mute

# Screen brightness
bindle = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bindle = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Lid: closing turns the laptop screen off only when another monitor is connected; without one,
# the system suspends (logind) and swayidle locks first. Opening restores monitors.conf.
bindl = , switch:off:Lid Switch, exec, $scripts/lid.sh open
bindl = , switch:on:Lid Switch, exec, $scripts/lid.sh close

# Screenshots
bind = , Print, exec, grim -g "$(slurp)" - | swappy -f -
bind = SHIFT, Print, exec, grim -g "$(slurp)" "$HOME/Pictures/screenshot-$(date +%Y%m%d-%H%M%S).png"
