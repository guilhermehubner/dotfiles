# Environment variables
# See https://wiki.hyprland.org/Configuring/Environment-variables/

# Use nvidia graphics
#env = LIBVA_DRIVER_NAME,nvidia
#env = GBM_BACKEND,nvidia-drm
#env = __GLX_VENDOR_LIBRARY_NAME,nvidia
# Hyprland no longer uses wlroots, so the old WLR_DRM_DEVICES (typed WRL_ before) is now AQ_DRM_DEVICES
#env = AQ_DRM_DEVICES,/dev/dri/card0

# Use integrated graphics
env = __EGL_VENDOR_LIBRARY_FILENAMES,/usr/share/glvnd/egl_vendor.d/50_mesa.json

# WLR_NO_HARDWARE_CURSORS and WLR_RENDERER_ALLOW_SOFTWARE were removed: they are wlroots
# variables and current Hyprland ignores them. The cursor fix is now `cursor:no_hardware_cursors`
# in look.conf. WLR_EGL_NO_MODIFIERS (commented out before) was dropped for the same reason.

# XDG Specifications
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# Cursor size, for XWayland apps and for hyprcursor
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# Application compatibilities
# Prefer Wayland but fall back to X11, so apps without Wayland support still start
env = GDK_BACKEND,wayland,x11
env = QT_QPA_PLATFORM,wayland;xcb
env = SDL_VIDEODRIVER,wayland,x11
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
# Replaces the deprecated QT_AUTO_SCREEN_SCALE_FACTOR
env = QT_ENABLE_HIGHDPI_SCALING,1
env = _JAVA_AWT_WM_NONREPARENTING,1
# Replaces OZONE_PLATFORM, which Electron apps don't read
env = ELECTRON_OZONE_PLATFORM_HINT,auto
