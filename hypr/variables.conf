# Shared variables, used by autostart.conf and remaps.conf

$mainMod = SUPER
$scripts = ~/.config/hypr/scripts

# -f makes swaylock return only once the screen is actually locked, so `$lock && systemctl suspend`
# can't suspend before the lock screen is up.
$lock = swaylock -f -c 24283b --inside-color 24283b --indicator-radius=150 -l
